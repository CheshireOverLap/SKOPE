[package]
name = "skope-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP Server for SKOPE Engine - Claude Desktop integration"
authors = ["SKOPE Team"]

[dependencies]
tokio = { version = "1", features = ["full", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"

# RON for scene parsing
ron = "0.8"

# File watching
notify = "6"
filetime = "0.2"
