[package]
name = "skope-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP Server for SKOPE Engine - Claude Desktop integration"
authors = ["SKOPE Team"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"

# File timestamps
filetime = "0.2"
