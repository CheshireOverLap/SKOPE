<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SKOPE Launcher</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <div class="app">
      <!-- 사이드바 -->
      <aside class="sidebar">
        <div class="logo">
          <h1>SKOPE</h1>
          <span class="version">v0.1.0</span>
        </div>

        <nav class="nav">
          <button class="nav-btn active" data-view="projects">
            <span class="icon">📁</span>
            프로젝트
          </button>
          <button class="nav-btn" data-view="settings">
            <span class="icon">⚙️</span>
            설정
          </button>
        </nav>

        <div class="sidebar-footer">
          <a href="https://github.com/SKOPEGames/SKOPE" target="_blank" class="link">
            GitHub
          </a>
        </div>
      </aside>

      <!-- 메인 컨텐츠 -->
      <main class="main">
        <!-- 프로젝트 뷰 -->
        <div id="projects-view" class="view active">
          <header class="header">
            <h2>프로젝트</h2>
            <div class="header-actions">
              <button id="btn-new-project" class="btn btn-primary">
                + 새 프로젝트
              </button>
              <button id="btn-open-folder" class="btn btn-secondary">
                폴더 열기
              </button>
            </div>
          </header>

          <div class="project-list" id="project-list">
            <!-- 프로젝트 목록이 여기에 동적으로 추가됨 -->
            <div class="empty-state" id="empty-state">
              <div class="empty-icon">🎮</div>
              <p>프로젝트가 없습니다</p>
              <p class="hint">새 프로젝트를 만들거나 기존 폴더를 열어보세요</p>
            </div>
          </div>
        </div>

        <!-- 설정 뷰 -->
        <div id="settings-view" class="view">
          <header class="header">
            <h2>설정</h2>
          </header>

          <div class="settings-content">
            <!-- Blender 상태 -->
            <div class="setting-group">
              <label>Blender</label>
              <div class="blender-status" id="blender-status">
                <div class="status-indicator" id="blender-indicator"></div>
                <span id="blender-status-text">확인 중...</span>
              </div>
              <div class="setting-row" style="margin-top: 8px;">
                <input type="text" id="blender-path" placeholder="경로 없음" readonly />
                <button id="btn-install-blender" class="btn btn-primary" style="display: none;">설치</button>
                <button id="btn-browse-blender" class="btn btn-secondary">찾기</button>
              </div>
              <p class="hint" id="blender-hint" style="margin-top: 8px; font-size: 11px; color: var(--text-muted);"></p>
            </div>

            <div class="setting-group">
              <label>코드 에디터</label>
              <select id="code-editor">
                <option value="rustover">RustRover</option>
                <option value="vscode">VS Code</option>
                <option value="zed">Zed</option>
                <option value="custom">사용자 지정</option>
              </select>
            </div>

            <div class="setting-group" id="custom-editor-group" style="display: none;">
              <label>에디터 경로</label>
              <div class="setting-row">
                <input type="text" id="custom-editor-path" placeholder="/path/to/editor" readonly />
                <button id="btn-browse-editor" class="btn btn-secondary">찾기</button>
              </div>
            </div>
          </div>
        </div>
      </main>

      <!-- 선택된 프로젝트 패널 -->
      <aside class="detail-panel" id="detail-panel">
        <div class="detail-header">
          <h3 id="selected-project-name">프로젝트 선택</h3>
          <p id="selected-project-path" class="path"></p>
        </div>

        <div class="detail-actions">
          <button id="btn-open-blender" class="btn btn-action" disabled>
            <span class="icon">🎨</span>
            Blender 열기
          </button>
          <button id="btn-open-editor" class="btn btn-action" disabled>
            <span class="icon">📝</span>
            코드 에디터
          </button>
          <button id="btn-play" class="btn btn-play" disabled>
            <span class="icon">▶</span>
            플레이
          </button>
        </div>

        <div class="detail-info" id="detail-info">
          <!-- 프로젝트 정보가 여기에 표시됨 -->
        </div>
      </aside>
    </div>

    <!-- 새 프로젝트 모달 -->
    <div class="modal" id="new-project-modal">
      <div class="modal-content">
        <h3>새 프로젝트</h3>
        <div class="form-group">
          <label>프로젝트 이름</label>
          <input type="text" id="new-project-name" placeholder="MyGame" />
        </div>
        <div class="form-group">
          <label>위치</label>
          <div class="setting-row">
            <input type="text" id="new-project-location" placeholder="~/Documents/SKOPE Projects" readonly />
            <button id="btn-browse-location" class="btn btn-secondary">찾기</button>
          </div>
        </div>
        <div class="modal-actions">
          <button id="btn-cancel-new" class="btn btn-secondary">취소</button>
          <button id="btn-create-project" class="btn btn-primary">생성</button>
        </div>
      </div>
    </div>
  </body>
</html>
