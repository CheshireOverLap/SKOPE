[package]
name = "skope_post"
version = "0.1.0"
edition = "2021"
authors = ["SKOPE Games <admin@skope.games>"]
description = "Post-processing pipeline for SKOPE Engine"
license = "MIT OR Apache-2.0"

[features]
default = []
# GPU feature enables wgpu-based pipelines
# Requires shaders to be available at compile time
gpu = ["wgpu"]

[dependencies]
bytemuck = { workspace = true }
glam = { workspace = true }
log = { workspace = true }
serde = { workspace = true }

# Optional GPU dependencies
wgpu = { workspace = true, optional = true }

[dev-dependencies]
# For tests
