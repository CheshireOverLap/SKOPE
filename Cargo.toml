[workspace]
resolver = "2"
members = [
    "crates/skope_ecs",
    "crates/skope_ecs_macros",
    "crates/skope_core",

    "crates/skope_endgame",
    "crates/skope_scripting",
    "crates/skope_render",
    "crates/skope_effects",
    "crates/skope_editor",
    "crates/skope_blitz",

    "crates/skope_game_ui",
    "crates/skope_gltf",
    "crates/skope_debug_ui",
    "crates/skope_mcp",
    "crates/skope_magic",
    "crates/skope_castling",
    "crates/skope_zugzwang",
    "crates/skope_resource",
    "crates/skope_gambit",
    "crates/skope_bishop",
    "crates/skope_promotion",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["SKOPE Games <admin@skope.games>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/SKOPEGames/SKOPE"

[workspace.dependencies]
# Core
wgpu = { version = "28.0", default-features = false, features = ["vulkan", "wgsl", "std", "parking_lot"] }
winit = "0.30"
glam = "0.29"
bytemuck = { version = "1.14", features = ["derive"] }
pollster = "0.3"

# ECS
skope_ecs = { path = "crates/skope_ecs" }

# Serialization
ron = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Assets
gltf = { version = "1.4", features = ["KHR_lights_punctual", "KHR_materials_transmission", "KHR_materials_volume", "KHR_materials_ior", "KHR_materials_emissive_strength", "KHR_materials_unlit", "KHR_texture_transform", "extensions", "extras"] }
image = "0.25"
exr = "1.74"
ktx2 = "0.3"  # GPU-optimized texture format with compression

# Physics
rapier3d = "0.22"
half = "2.7.1"

# UI
ab_glyph = "0.2"

# Scripting
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize"] }
regex = "1.10"
notify = "7.0"

# Async (for live_link)
tokio-tungstenite = "0.24"
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "sync", "net", "time", "macros"] }

# Audio
rodio = "0.19"

# File Dialogs
rfd = "0.15"

# Internal crates
skope_core = { path = "crates/skope_core" }

skope_endgame = { path = "crates/skope_endgame" }
skope_scripting = { path = "crates/skope_scripting" }
skope_render = { path = "crates/skope_render" }
skope_effects = { path = "crates/skope_effects" }
skope_editor = { path = "crates/skope_editor" }
skope_blitz = { path = "crates/skope_blitz" }

skope_game_ui = { path = "crates/skope_game_ui" }
skope_gltf = { path = "crates/skope_gltf" }
skope_debug_ui = { path = "crates/skope_debug_ui" }
skope_mcp = { path = "crates/skope_mcp" }
skope_magic = { path = "crates/skope_magic" }
skope_castling = { path = "crates/skope_castling" }
skope_zugzwang = { path = "crates/skope_zugzwang" }
skope_resource = { path = "crates/skope_resource" }
skope_gambit = { path = "crates/skope_gambit", features = ["gpu"] }
skope_bishop = { path = "crates/skope_bishop" }
skope_promotion = { path = "crates/skope_promotion" }

# Parallelism & threading
rayon = "1.10"
parking_lot = "0.12"

# ============ Main Package ============

[package]
name = "skope"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "A Rust-based game engine with Blender integration"
license.workspace = true
repository.workspace = true

[dependencies]
# Workspace dependencies
wgpu = { workspace = true }
winit = { workspace = true }
glam = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
pollster = { workspace = true }
bytemuck = { workspace = true }
image = { workspace = true }
skope_ecs = { workspace = true }
ron = { workspace = true }
serde = { workspace = true }
rapier3d = { workspace = true }
ab_glyph = { workspace = true }
mlua = { workspace = true }
regex = { workspace = true }
notify = { workspace = true }
ktx2 = { workspace = true }
rayon = { workspace = true }
parking_lot = { workspace = true }

# Internal crates (to be added incrementally)
skope_core = { workspace = true }

skope_endgame = { workspace = true, features = ["gpu"] }
skope_effects = { workspace = true, features = ["gpu"] }
skope_blitz = { workspace = true, features = ["gpu"] }

skope_game_ui = { workspace = true, features = ["gpu"] }
skope_gltf = { workspace = true }
skope_debug_ui = { workspace = true }
skope_magic = { workspace = true, features = ["gpu"] }
skope_scripting = { workspace = true }
skope_render = { workspace = true }
skope_editor = { workspace = true }
skope_castling = { workspace = true, features = ["gpu", "app"] }
skope_zugzwang = { workspace = true, features = ["gpu"] }
skope_gambit = { workspace = true, features = ["gpu"] }
skope_bishop = { workspace = true, features = ["gpu"] }

# File dialogs
rfd = { workspace = true }

# Optional dependencies
tokio-tungstenite = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
rodio = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3.10"

[features]
default = []
audio = ["rodio"]
live_link = ["tokio-tungstenite", "futures-util", "tokio", "serde_json"]
shader_validation = []

[profile.dev]
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
strip = true
