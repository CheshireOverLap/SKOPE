[package]
name = "skope"
version = "0.1.0"
edition = "2021"
authors = ["SKOPE Games <admin@skope.games>"]
description = "A Rust-based game engine with Blender integration"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SKOPEGames/SKOPE"

[dependencies]
wgpu = "23.0"
winit = "0.30"
glam = "0.29"
env_logger = "0.11"
log = "0.4"
pollster = "0.3"
bytemuck = { version = "1.14", features = ["derive"] }

[profile.dev]
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
strip = true
