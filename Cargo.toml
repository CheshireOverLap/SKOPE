[package]
name = "SKOPE"
version = "0.1.0"
edition = "2021"
authors = ["SKOPE Games <admin@skope.games>"]
description = "A Rust-based game engine with Blender integration"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SKOPEGames/SKOPE"

[dependencies]
wgpu = "27.0"
winit = "0.30"
glam = "0.29"
env_logger = "0.11"
log = "0.4"
pollster = "0.3"
bytemuck = { version = "1.14", features = ["derive"] }
gltf = "1.4"
image = "0.25"
bevy_ecs = "0.15"
bevy_hierarchy = "0.15"
ron = "0.8"
serde = { version = "1.0", features = ["derive"] }

# Physics
rapier3d = "0.22"
half = "2.7.1"

# UI
egui = "0.33"
egui-wgpu = "0.33"
egui-winit = "0.33"

[profile.dev]
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
strip = true
